<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block subject %}MiniLink{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333333;
    }
    .wrapper {
      width: 100%;
      padding: 40px 0;
      background-color: #f4f6f9;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .header {
      background-color: #4f46e5;
      padding: 28px 40px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .header span.accent {
      color: #a5b4fc;
    }
    .content {
      padding: 36px 40px;
    }
    .content h2 {
      margin-top: 0;
      font-size: 20px;
      color: #1e1b4b;
    }
    .content p {
      line-height: 1.7;
      font-size: 15px;
      color: #555555;
    }
    .btn-wrapper {
      text-align: center;
      margin: 28px 0;
    }
    .btn {
      display: inline-block;
      padding: 13px 32px;
      background-color: #4f46e5;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .btn:hover {
      background-color: #4338ca;
    }
    .divider {
      height: 1px;
      background-color: #e5e7eb;
      margin: 24px 0;
    }
    .footer {
      background-color: #f9fafb;
      padding: 20px 40px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
    }
    .footer a {
      color: #6366f1;
      text-decoration: none;
    }
    .info-box {
      background-color: #f0f0ff;
      border-left: 4px solid #6366f1;
      border-radius: 4px;
      padding: 14px 18px;
      margin: 20px 0;
      font-size: 14px;
      color: #3730a3;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>Mini<span class="accent">Link</span></h1>
      </div>

      <!-- Main content -->
      <div class="content">
        {% block content %}{% endblock %}
      </div>

      <!-- Footer -->
      <div class="footer">
        <p>© {{ year }} MiniLink. All rights reserved.</p>
        <p>
          Bạn nhận được email này vì tài khoản của bạn đã thực hiện một thao tác trên
          <a href="{{ base_url }}">MiniLink</a>.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
